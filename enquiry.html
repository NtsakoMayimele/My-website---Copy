<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrol Your Child | Rise Up Hoops Enquiry Form</title>
    <meta name="description" content="Ask about a Rise Up Hoops basketball programme. Fill in the form and we will tell you the cost and how many spots are open.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">RISE UP HOOPS</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section class="section">
        <h1>Enquiry Form</h1>
        <img src="images/images.jpg" alt="Rise Up Hoops players on court" width="200">
    </section>

    <section class="section alt-bg">
        <button type="button" class="btn btn-offer" id="offer-btn">Special Offer</button>
        <div class="offer-box" id="offer-box" hidden>
            <h3>Special Offer: 50% Off!</h3>
            <p>Sign up 2 or more children and get 50% off the monthly fee. That is R25 instead of R50 per child.</p>
        </div>

        <!-- action = where the data is sent (a free test address; swap it for a real one later) -->
        <form id="enquiry-form" class="enquiry-form" action="https://jsonplaceholder.typicode.com/posts" method="post" novalidate>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
                <span class="error" id="name-error"></span>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" required placeholder="082 456 7890">
                <span class="error" id="phone-error"></span>
            </div>

            <div class="form-group">
                <label for="email">Email (optional)</label>
                <input type="email" id="email" name="email">
                <span class="error" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="programme">Programme</label>
                <select id="programme" name="programme" required>
                    <option value="">Choose a programme</option>
                    <option value="Seshego">Seshego (ages 8-13)</option>
                    <option value="Mankweng">Mankweng (ages 10-15)</option>
                    <option value="Sebayeng">Sebayeng (ages 8-13)</option>
                    <option value="Lebowakgomo">Lebowakgomo (ages 13-18)</option>
                </select>
                <span class="error" id="programme-error"></span>
            </div>

            <div class="form-group">
                <label for="age">Child's age</label>
                <input type="number" id="age" name="age" required min="5" max="18">
                <span class="error" id="age-error"></span>
            </div>

            <div class="form-group">
                <label for="children">Number of children signing up</label>
                <input type="number" id="children" name="children" required min="1" max="10" value="1">
                <span class="error" id="children-error"></span>
            </div>

            <div class="form-group">
                <label for="message">Message (optional)</label>
                <textarea id="message" name="message" rows="5" maxlength="500"></textarea>
                <span class="error" id="message-error"></span>
            </div>

            <div class="form-submit">
                <button type="submit" class="btn">Send Enquiry</button>
            </div>
        </form>

        <!-- The reply (cost + spots left) appears here after you send -->
        <div class="response-box" id="response"></div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Rise Up Hoops Foundation</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
